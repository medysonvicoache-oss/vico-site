<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VICO — Shop</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080808;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

/* HEADER */

header {
    height: 70px;
    border-bottom: 1px solid #222;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6%;
    position: sticky;
    top: 0;
    background: rgba(8,8,8,.96);
    z-index: 20;
}

.logo {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -2px;
}

nav {
    display: flex;
    gap: 38px;
}

nav a {
    color: #fff;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 1px;
}

.cart {
    cursor: pointer;
    font-size: 20px;
}

/* INTRO */

.intro {
    padding: 38px 6% 30px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
}

.description {
    max-width: 300px;
    font-size: 12px;
    line-height: 1.5;
    letter-spacing: 1px;
    color: #aaa;
    text-transform: uppercase;
}

.filters {
    font-size: 11px;
    color: #aaa;
    letter-spacing: 1px;
}

/* PRODUCTS */

.products {
    padding: 0 6% 80px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.product {
    cursor: pointer;
    border: 1px solid #252525;
    background: #101010;
    transition: .3s;
}

.product:hover {
    border-color: #555;
    transform: translateY(-3px);
}

.product-image {
    height: 620px;
    background: #111;
    position: relative;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

.tag {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 2;
    border: 1px solid #fff;
    padding: 8px 13px;
    font-size: 10px;
    letter-spacing: 2px;
    background: #080808;
}

.product-info {
    padding: 24px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.product-name {
    font-size: 14px;
    font-weight: bold;
    letter-spacing: .8px;
}

.product-price {
    margin-top: 10px;
    color: #999;
    font-size: 12px;
}

.product-arrow {
    font-size: 25px;
}

/* MODAL */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    z-index: 100;
    overflow-y: auto;
}

.modal.active {
    display: block;
}

.modal-content {
    min-height: 100vh;
    padding: 35px 6%;
    position: relative;
}

.close {
    position: absolute;
    top: 25px;
    right: 5%;
    font-size: 30px;
    cursor: pointer;
    z-index: 5;
}

/* PRODUCT PAGE */

.product-page {
    max-width: 1250px;
    margin: 50px auto 0;
    display: grid;
    grid-template-columns: 1.2fr .8fr;
    gap: 70px;
}

/* IMAGES */

.gallery {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.main-image {
    height: 700px;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.main-image img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.image-buttons {
    display: flex;
    gap: 10px;
}

.image-buttons button {
    flex: 1;
    background: #111;
    color: #fff;
    border: 1px solid #444;
    padding: 15px;
    cursor: pointer;
    font-size: 11px;
    letter-spacing: 1px;
}

.image-buttons button.active {
    background: #fff;
    color: #000;
}

/* DETAILS */

.details {
    padding-top: 30px;
}

.details h1 {
    font-size: 28px;
    margin-bottom: 15px;
}

.details .price {
    color: #aaa;
    font-size: 15px;
    margin-bottom: 45px;
}

.label {
    font-size: 11px;
    color: #aaa;
    letter-spacing: 1px;
    margin-bottom: 12px;
}

.sizes {
    display: flex;
    gap: 8px;
    margin-bottom: 35px;
}

.size {
    width: 55px;
    height: 48px;
    border: 1px solid #444;
    background: #111;
    color: #fff;
    cursor: pointer;
}

.size.selected {
    background: #fff;
    color: #000;
    border-color: #fff;
}

.buy {
    width: 100%;
    height: 55px;
    background: #fff;
    color: #000;
    border: none;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
    margin-bottom: 10px;
}

.add-cart {
    width: 100%;
    height: 55px;
    background: transparent;
    color: #fff;
    border: 1px solid #555;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
}

.add-cart:hover {
    border-color: #fff;
}

.message {
    margin-top: 20px;
    color: #aaa;
    font-size: 12px;
    display: none;
}

/* MOBILE */

@media (max-width: 800px) {

    header {
        padding: 0 20px;
    }

    nav {
        display: none;
    }

    .intro {
        padding: 30px 20px;
    }

    .products {
        padding: 0 20px 50px;
        grid-template-columns: 1fr;
    }

    .product-image {
        height: 500px;
    }

    .product-page {
        grid-template-columns: 1fr;
        gap: 30px;
        margin-top: 30px;
    }

    .main-image {
        height: 500px;
    }

    .details {
        padding-bottom: 40px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">vico</div>

    <nav>
        <a href="#">HOME</a>
        <a href="#">SHOP</a>
        <a href="#">COLEÇÃO</a>
        <a href="#">SOBRE</a>
    </nav>

    <div class="cart">
        🛒
    </div>

</header>


<section class="intro">

    <div class="description">
        PEÇAS FEITAS PARA QUEM NÃO TEM MEDO DE
        ENXERGAR ALÉM DO ÓBVIO.
    </div>

    <div class="filters">
        FILTRAR &nbsp;|&nbsp; ORDENAR: MAIS RECENTES ↓
    </div>

</section>


<section class="products">

    <!-- THE TRUTH HURTS -->

    <article class="product" onclick="openProduct('truth')">

        <div class="product-image">

            <span class="tag">NOVO</span>

            <img
                src="the-truth-hurts-front.png"
                alt="The Truth Hurts Tee"
            >

        </div>

        <div class="product-info">

            <div>
                <div class="product-name">
                    THE TRUTH HURTS TEE
                </div>

                <div class="product-price">
                    R$ 129,00
                </div>
            </div>

            <div class="product-arrow">
                →
            </div>

        </div>

    </article>


    <!-- KYAN -->

    <article class="product" onclick="openProduct('kyan')">

        <div class="product-image">

            <span class="tag">NOVO</span>

            <img
                src="kyan-front.png"
                alt="Kyan Tee"
            >

        </div>

        <div class="product-info">

            <div>
                <div class="product-name">
                    KYAN TEE
                </div>

                <div class="product-price">
                    R$ 129,00
                </div>
            </div>

            <div class="product-arrow">
                →
            </div>

        </div>

    </article>

</section>


<!-- PRODUCT MODAL -->

<div class="modal" id="modal">

    <div class="modal-content">

        <div class="close" onclick="closeProduct()">
            ×
        </div>

        <div class="product-page">

            <div class="gallery">

                <div class="main-image">

                    <img id="productImage" src="" alt="Produto">

                </div>

                <div class="image-buttons">

                    <button
                        id="frontButton"
                        onclick="showFront()"
                    >
                        FRENTE
                    </button>

                    <button
                        id="backButton"
                        onclick="showBack()"
                    >
                        VERSO
                    </button>

                </div>

            </div>


            <div class="details">

                <h1 id="productTitle">
                    Produto
                </h1>

                <div class="price">
                    R$ 129,00
                </div>


                <div class="label">
                    ESCOLHA O TAMANHO
                </div>

                <div class="sizes">

                    <button
                        class="size"
                        onclick="selectSize(this)"
                    >
                        P
                    </button>

                    <button
                        class="size"
                        onclick="selectSize(this)"
                    >
                        M
                    </button>

                    <button
                        class="size"
                        onclick="selectSize(this)"
                    >
                        G
                    </button>

                    <button
                        class="size"
                        onclick="selectSize(this)"
                    >
                        GG
                    </button>

                </div>


                <button
                    class="buy"
                    onclick="buyProduct()"
                >
                    COMPRAR AGORA
                </button>


                <button
                    class="add-cart"
                    onclick="addCart()"
                >
                    ADICIONAR AO CARRINHO
                </button>


                <div
                    class="message"
                    id="message"
                >
                </div>

            </div>

        </div>

    </div>

</div>


<script>

let currentProduct = null;
let selectedSize = null;


/* PRODUTOS */

const products = {

    truth: {
        title: "THE TRUTH HURTS TEE",
        front: "the-truth-hurts-front.png",
        back: "the-truth-hurts-back.png"
    },

    kyan: {
        title: "KYAN TEE",
        front: "kyan-front.png",
        back: "kyan-back.png"
    }

};


/* ABRIR PRODUTO */

function openProduct(product) {

    currentProduct = product;

    const data = products[product];

    document.getElementById("productTitle").textContent =
        data.title;

    document.getElementById("productImage").src =
        data.front;

    document.getElementById("modal").classList.add("active");

    document.getElementById("frontButton").classList.add("active");

    document.getElementById("backButton").classList.remove("active");

    selectedSize = null;

    document.querySelectorAll(".size").forEach(function(button) {
        button.classList.remove("selected");
    });

}


/* FECHAR */

function closeProduct() {

    document.getElementById("modal").classList.remove("active");

}


/* FRENTE */

function showFront() {

    const data = products[currentProduct];

    document.getElementById("productImage").src =
        data.front;

    document.getElementById("frontButton").classList.add("active");

    document.getElementById("backButton").classList.remove("active");

}


/* VERSO */

function showBack() {

    const data = products[currentProduct];

    document.getElementById("productImage").src =
        data.back;

    document.getElementById("backButton").classList.add("active");

    document.getElementById("frontButton").classList.remove("active");

}


/* TAMANHO */

function selectSize(button) {

    document.querySelectorAll(".size").forEach(function(size) {
        size.classList.remove("selected");
    });

    button.classList.add("selected");

    selectedSize = button.textContent;

}


/* COMPRAR */

function buyProduct() {

    if (!selectedSize) {

        alert("Selecione um tamanho primeiro.");

        return;

    }

    const product = products[currentProduct];

    const message =
        "Olá! Quero comprar a " +
        product.title +
        " no tamanho " +
        selectedSize +
        ".";

    /*
       TROQUE O NÚMERO ABAIXO PELO WHATSAPP DA VICO
       Formato: 55 + DDD + número
    */

    const whatsapp =
        "https://wa.me/5500000000000?text=" +
        encodeURIComponent(message);

    window.open(whatsapp, "_blank");

}


/* CARRINHO */

function addCart() {

    if (!selectedSize) {

        alert("Selecione um tamanho primeiro.");

        return;

    }

    const product = products[currentProduct];

    const message = document.getElementById("message");

    message.textContent =
        product.title +
        " — tamanho " +
        selectedSize +
        " adicionado ao carrinho.";

    message.style.display = "block";

}

</script>

</body>
</html>
