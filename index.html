<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VICO — Shop</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
header{height:70px;border-bottom:1px solid #202020;display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;background:rgba(5,5,5,.97);z-index:20}
.logo{font-size:28px;font-weight:800;letter-spacing:-1px}
nav{display:flex;gap:35px}nav a{color:#aaa;text-decoration:none;font-size:11px;letter-spacing:1.5px}nav a:hover{color:#fff}
.hero{padding:45px 6% 35px}.hero p{color:#999;font-size:12px;line-height:1.5;text-transform:uppercase;letter-spacing:1px;max-width:320px}
.filters{display:flex;justify-content:flex-end;gap:30px;padding:0 6% 30px;color:#999;font-size:11px;text-transform:uppercase;letter-spacing:1px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;padding:0 6% 80px}
.product{cursor:pointer}.product-image{position:relative;width:100%;aspect-ratio:1/1;background:#111;overflow:hidden}
.product-image img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}.product:hover .product-image img{transform:scale(1.025)}
.tag{position:absolute;top:18px;left:18px;z-index:2;border:1px solid white;padding:8px 13px;font-size:9px;letter-spacing:2px}
.product-info{min-height:90px;background:#090909;padding:22px 20px;display:flex;justify-content:space-between;align-items:center;border:1px solid #202020;border-top:none}
.product-name{font-size:13px;font-weight:bold;letter-spacing:1px;margin-bottom:10px}.product-price{font-size:11px;color:#999}
.product-arrow{font-size:25px;transition:transform .3s}.product:hover .product-arrow{transform:translateX(7px)}
.product-modal{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:9999;display:none;align-items:center;justify-content:center;padding:30px}
.product-modal.active{display:flex}
.product-modal-content{width:92%;max-width:1200px;max-height:92vh;background:#090909;border:1px solid #222;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:45px;padding:35px;position:relative}
.close-modal{position:absolute;right:20px;top:15px;z-index:5;width:35px;height:35px;background:none;border:none;color:#fff;font-size:30px;cursor:pointer}
.product-gallery{min-width:0;display:flex;align-items:center;justify-content:center;background:#111;min-height:550px}.product-gallery img{width:100%;height:100%;max-height:70vh;object-fit:contain;display:block}
.product-details{display:flex;flex-direction:column;justify-content:center}.product-details h2{font-size:22px;letter-spacing:1px;margin-bottom:15px}.product-details .price{color:#999;font-size:13px;margin-bottom:40px}
.view-title{color:#777;font-size:9px;letter-spacing:2px;margin-bottom:12px}.view-buttons{display:flex;gap:8px}
.view-buttons button{background:transparent;color:#fff;border:1px solid #444;padding:13px 20px;cursor:pointer;font-size:10px;letter-spacing:1.5px}
.view-buttons button:hover,.view-buttons button.active{background:#fff;color:#000;border-color:#fff}
footer{border-top:1px solid #202020;padding:35px 6%;color:#666;font-size:10px;letter-spacing:1px}
@media(max-width:800px){header{padding:0 20px}nav{gap:15px}nav a{font-size:9px}.hero{padding:35px 20px}.filters{padding:0 20px 20px;justify-content:flex-start;gap:15px;flex-wrap:wrap}.products{grid-template-columns:1fr;padding:0 20px 50px}.product-modal{padding:10px}.product-modal-content{width:96%;max-height:95vh;overflow-y:auto;display:flex;flex-direction:column;gap:20px;padding:20px}.product-gallery{min-height:400px}.product-gallery img{max-height:55vh}.product-details{padding-bottom:15px}}
</style>
</head>
<body>
<header><div class="logo">VICO</div><nav><a href="#">HOME</a><a href="#shop">SHOP</a><a href="#">COLEÇÃO</a><a href="#">SOBRE</a></nav></header>

<section class="hero"><p>Peças feitas para quem não tem medo de enxergar além do óbvio.</p></section>

<div class="filters"><span>FILTRAR ↓</span><span>ORDENAR: MAIS RECENTES ↓</span></div>

<section class="products" id="shop">
<article class="product" onclick="openProduct('truth')">
<div class="product-image"><span class="tag">NOVO</span><img src="assets/the-truth-hurts-front.png" alt="The Truth Hurts Tee"></div>
<div class="product-info"><div><div class="product-name">THE TRUTH HURTS TEE</div><div class="product-price">R$ 129,00</div></div><div class="product-arrow">→</div></div>
</article>

<article class="product" onclick="openProduct('kyan')">
<div class="product-image"><span class="tag">NOVO</span><img src="assets/kyan-front.png" alt="Kyan Tee"></div>
<div class="product-info"><div><div class="product-name">KYAN TEE</div><div class="product-price">R$ 129,00</div></div><div class="product-arrow">→</div></div>
</article>
</section>

<div id="productModal" class="product-modal" onclick="closeOutside(event)">
<div class="product-modal-content" onclick="event.stopPropagation()">
<button class="close-modal" onclick="closeProduct()">×</button>
<div class="product-gallery"><img id="productMainImage" src="" alt="Produto"></div>
<div class="product-details">
<h2 id="productTitle">PRODUTO</h2><div class="price" id="productPrice">R$ 129,00</div>
<div class="view-title">VISUALIZAR</div>
<div class="view-buttons"><button id="frontButton" class="active" onclick="showSide('front')">FRENTE</button><button id="backButton" onclick="showSide('back')">VERSO</button></div>
</div></div></div>

<footer>© 2026 VICO — TODOS OS DIREITOS RESERVADOS.</footer>

<script>
const products={
truth:{title:"THE TRUTH HURTS TEE",price:"R$ 129,00",front:"assets/the-truth-hurts-front.png",back:"assets/the-truth-hurts-back.png"},
kyan:{title:"KYAN TEE",price:"R$ 129,00",front:"assets/kyan-front.png",back:"assets/kyan-back.png"}
};
let currentProduct=null;
function openProduct(name){
currentProduct=products[name];
document.getElementById("productModal").classList.add("active");
document.getElementById("productTitle").textContent=currentProduct.title;
document.getElementById("productPrice").textContent=currentProduct.price;
document.getElementById("productMainImage").src=currentProduct.front;
document.getElementById("frontButton").classList.add("active");
document.getElementById("backButton").classList.remove("active");
document.body.style.overflow="hidden";
}
function showSide(side){
if(!currentProduct)return;
const image=document.getElementById("productMainImage"),front=document.getElementById("frontButton"),back=document.getElementById("backButton");
if(side==="front"){image.src=currentProduct.front;front.classList.add("active");back.classList.remove("active")}
else{image.src=currentProduct.back;back.classList.add("active");front.classList.remove("active")}
}
function closeProduct(){document.getElementById("productModal").classList.remove("active");document.body.style.overflow=""}
function closeOutside(e){if(e.target.id==="productModal")closeProduct()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeProduct()});
</script>
</body>
</html>
